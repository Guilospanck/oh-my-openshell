# Builds the release archives with the same script a local release uses (scripts/release), one
# runner per platform, then publishes them. Not exercised while Actions credits are exhausted:
# use `scripts/release vX.Y.Z --linux amd64 arm64` and `gh release create` by hand until then.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-13, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: scripts/release "$GITHUB_REF_NAME" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: osh-${{ matrix.os }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Same renderer and tap as `just release`. The deploy key comes from `just release-setup-ci-key`.
      - name: Update Homebrew formula in tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Guilospanck/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/render-formula "$GITHUB_REF_NAME" dist > tap/Formula/oh-my-openshell.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/oh-my-openshell.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date; nothing to push."
          else
            git commit -m "oh-my-openshell ${GITHUB_REF_NAME#v}"
            git push origin HEAD
          fi
