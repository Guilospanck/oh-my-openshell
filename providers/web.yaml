# Local template: read-only web access for research, for curl and Claude Code.
# Grants: GET, HEAD and OPTIONS on the documentation and reference hosts below, port 443, to
# the programs below only. Writes (POST, PUT, DELETE) stay denied, as do other programs, other
# hosts and other ports.
# This is a host list, not "any host", and so weaker than a browser: OpenShell (0.1.7) rejects
# the bare wildcards `*` and `**` and TLD wildcards like `**.com` when it composes the sandbox
# policy (`invalid host wildcard`), and a wildcard would also clash with every other profile's
# endpoint on port 443 (its ambiguity check). Add hosts here as research needs them; subdomain
# wildcards (`*.example.com`, `**.example.com`) are accepted. Reads can still carry data out (a
# secret in a URL or header), so attach it only where that is acceptable and detach it afterwards.
# raw.githubusercontent.com has the same shape as in claude-code.yaml so both attach together.
# `just test-sandbox` checks a listed host reads, an unlisted one does not, and a POST is refused.
# Edit `binaries` if Claude Code is installed elsewhere in your image.
# Smoke test:
#   openshell sandbox create --provider web -- curl -sI https://docs.rs/
id: web
display_name: Web browsing (read-only)
description: Read-only HTTP(S) to common documentation and reference hosts for curl and Claude Code
category: data
endpoints:
  - host: developer.mozilla.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: docs.rs
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: doc.rust-lang.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: crates.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: pkg.go.dev
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: docs.python.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: peps.python.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: www.npmjs.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: docs.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: raw.githubusercontent.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: stackoverflow.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: en.wikipedia.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: learn.microsoft.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: docs.docker.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: kubernetes.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: www.rfc-editor.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: datatracker.ietf.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  - /usr/local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
  - /usr/local/bin/claude
