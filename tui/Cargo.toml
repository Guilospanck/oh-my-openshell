[package]
name = "osh-tui"
version = "0.7.1"
edition = "2021"
description = "ratatui front end for the OpenShell CLI"
license = "MIT"

[workspace]
members = ["core"]

[dependencies]
osh-core = { path = "core" }
libghostty-vt = "=0.2.2"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde_json = "1.0.154"
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
osh-core = { path = "core", features = ["testing"] }
